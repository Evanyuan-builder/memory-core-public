[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-core-sdk"
version = "0.1.0"
description = "Python client for the Memory Core REST API — role-aware memory layer for multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Evan", email = "longtide1230@gmail.com" }]
keywords = ["memory", "agents", "multi-agent", "llm", "retrieval", "rest-client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://memory-core.chinasourcingbridge.com"
Repository = "https://github.com/Evanyuan-builder/memory-core-public"
"Eval Harness" = "https://github.com/Evanyuan-builder/memory-core-eval"

[tool.setuptools.packages.find]
include = ["memory_core_sdk*"]
exclude = ["examples*", "tests*"]
